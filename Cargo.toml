[package]
name = "aurora-export"
version = "1.0.0"
edition = "2021"
description = "AuroraExport - 原神祈愿 / 星穹铁道跃迁记录导出工具"
license = "MIT"
authors = ["AuroraExport contributors"]
rust-version = "1.85"

[dependencies]
eframe = { version = "0.36", default-features = false, features = [
    "glow",
    "default_fonts",
    "x11",
    "wayland",
] }
egui = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
rust_xlsxwriter = "0.99"
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "std",
    "serde",
] }
png = "0.17"
dirs = "7"
url = "2"
single-instance = "0.3"
raw-window-handle = "0.6"

[target.'cfg(not(windows))'.dependencies]
rfd = "0.17.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false
